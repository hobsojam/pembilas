name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    # Dependabot PRs are routine version bumps with no meaningful diff for
    # static analysis, and Dependabot's read-only token can't see secrets
    # like SONAR_TOKEN anyway — skip the scan rather than fail the check.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Generates coverage/lcov.info, which sonar-project.properties points
      # Sonar at -- without this the scan has no coverage data to report.
      - run: npm run coverage

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
